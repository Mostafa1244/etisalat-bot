name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-v2-

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev wget patch
          echo "ACLOCAL_PATH=/usr/share/aclocal" >> $GITHUB_ENV

      - name: Install Buildozer + Cython + Fix Pip Spinner Error
        run: |
          echo "pip<24.1" > $HOME/pip-constraints.txt
          echo "setuptools<70.0.0" >> $HOME/pip-constraints.txt
          echo "wheel<0.44.0" >> $HOME/pip-constraints.txt
          echo "cython==0.29.36" >> $HOME/pip-constraints.txt
          
          pip install "pip<24.1" "setuptools<70.0.0" "wheel<0.44.0" "virtualenv<20.26.0"
          pip install "cython==0.29.36" "buildozer==1.5.0"
          
          echo "PIP_CONSTRAINT=$HOME/pip-constraints.txt" >> $GITHUB_ENV
          echo "VIRTUALENV_PIP=24.0" >> $GITHUB_ENV
          echo "VIRTUALENV_SETUPTOOLS=69.5.1" >> $GITHUB_ENV
          echo "VIRTUALENV_WHEEL=0.43.0" >> $GITHUB_ENV
          echo "VIRTUALENV_NO_PERIODIC_UPDATE=1" >> $GITHUB_ENV

      - name: Build APK
        env:
          ACLOCAL_PATH: /usr/share/aclocal
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MostafaBot-APK
          path: bin/*.apk
